name: 재개발닷컴 매물 알림

on:
  schedule:
    # UTC 0,3,6,9,12시 = KST 09,12,15,18,21시. 밤시간(00,03,06시) 제외
    - cron: '0 0,3,6,9,12 * * *'
  # 이제 매 실행이 전 구역 현황을 보내므로 force 입력이 필요 없다.
  workflow_dispatch:

concurrency:
  group: jaegebal-notify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # 겹친 실행(맥 깨우개·예약)이 줄을 섰다 돌 때 옛 확인 기록으로 같은 알림을 또 보내지 않게 — 늘 main 최신을 받는다
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 알림 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/notify.py

      - name: state.json 커밋
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git add state.json
          git commit -m "chore: state.json 갱신"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase --autostash
          done
          exit 1
